<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRPF Smart Mess Management</title>
<style>
:root{--navy:#063c2a;--navy2:#022b1e;--green:#087b45;--gold:#ffe329;--bg:#071b14;--ink:#fff;--muted:#b7cfc2;--line:#287b52;--white:#fff;--red:#e83e49;--blue:#00b94f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.sidebar{width:250px;background:linear-gradient(180deg,var(--navy),#0b1729);color:#fff;padding:22px 14px;flex-shrink:0}.brand{display:flex;gap:12px;align-items:center;padding:3px 9px 22px;border-bottom:1px solid #ffffff22}.brandmark{width:43px;height:43px;border-radius:13px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:20px}.brand h1{font-size:15px;line-height:1.25;margin:0}.brand small{color:#b9c9dc;font-size:11px}.navlabel{font-size:10px;letter-spacing:1.4px;color:#93a9c3;padding:20px 11px 8px}.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#cbd7e6;padding:12px 13px;border-radius:10px;text-align:left;margin:3px 0;font-size:13px}.nav button:hover,.nav button.active{background:#ffffff18;color:white}.nav button.active{box-shadow:inset 3px 0 var(--gold)}.nav .ico{width:20px;text-align:center;font-size:16px}.sidefoot{font-size:11px;color:#9db0c7;margin:24px 10px 0;line-height:1.6}.main{flex:1;min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:15px;position:sticky;top:0;z-index:5}.crumb{font-size:12px;color:var(--muted)}.topbar h2{font-size:20px;margin:3px 0 0}.topactions{display:flex;gap:9px;align-items:center}.content{padding:25px 28px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:20px}.pagehead h2{font-size:23px;margin:0 0 6px}.pagehead p{margin:0;color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 13px;font-size:12px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{filter:brightness(.98);transform:translateY(-1px)}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.danger{color:var(--red);border-color:#f2cbd0}.btn.small{padding:6px 8px;font-size:11px;border-radius:7px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:65px;height:65px;border-radius:50%;background:#16845b0d;right:-18px;top:-18px}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:25px;font-weight:800;margin:8px 0 4px;letter-spacing:-.5px}.stat .sub{font-size:11px;color:var(--muted)}.stat .sicon{float:right;background:#e8f5ef;color:var(--green);border-radius:10px;padding:9px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 19px;border-bottom:1px solid var(--line)}.panelhead h3{font-size:14px;margin:0}.panelbody{padding:18px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.search{min-width:190px;max-width:320px;flex:1}.field,select,textarea{width:100%;border:1px solid #d8e0e9;border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink);outline:none;font-size:12px}.field:focus,select:focus,textarea:focus{border-color:#70a9dc;box-shadow:0 0 0 3px #2f6fed12}.filter{max-width:190px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;background:#f8fafc;color:#718096;font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:12px 15px;border-bottom:1px solid var(--line)}td{padding:12px 15px;border-bottom:1px solid #edf1f5;font-size:12px}tbody tr:hover{background:#fbfdff}.empty{text-align:center;color:var(--muted);padding:35px}.pill{display:inline-flex;align-items:center;border-radius:20px;padding:5px 8px;font-size:10px;font-weight:700;background:#e8f5ef;color:#16704d}.pill.red{background:#fdebed;color:#a62937}.pill.amber{background:#fff3d8;color:#8a5b00}.pill.blue{background:#eaf1ff;color:#2859b8}.muted{color:var(--muted)}.actions{display:flex;gap:5px}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.formgroup label{display:block;font-size:11px;font-weight:700;margin-bottom:6px;color:#536275}.formgroup.full{grid-column:1/-1}.hint{font-size:11px;color:var(--muted);line-height:1.5}.notice{padding:12px 14px;border-radius:9px;background:#fff7e6;color:#78530b;font-size:12px;line-height:1.55;border:1px solid #f4e0b2}.notice.blue{background:#edf5ff;color:#24518a;border-color:#d3e5ff}.modalback{position:fixed;inset:0;background:#0a1629a8;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modalback.show{display:flex}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:15px;box-shadow:0 25px 80px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}.modalhead h3{margin:0;font-size:16px}.modalbody{padding:22px}.modalfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.xbtn{border:0;background:#f1f4f8;border-radius:8px;width:30px;height:30px}.recipe-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.recipe-card{border:1px solid var(--line);border-radius:12px;padding:14px}.recipe-card h4{margin:0 0 6px}.recipe-card p{font-size:11px;color:var(--muted);line-height:1.5}.metricline{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf1f5;font-size:12px}.metricline:last-child{border:0}.logo-mini{width:28px;height:28px;border-radius:8px;background:#eaf5ef;display:inline-grid;place-items:center;margin-right:7px}.footer{text-align:center;font-size:10px;color:#8996a5;padding:20px}.hidden{display:none!important}.mobilemenu{display:none}.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.breakdown>div{padding:14px;background:#f8fafc;border-radius:10px}.breakdown strong{display:block;font-size:18px;margin-top:7px}.toast{position:fixed;bottom:20px;right:20px;background:#132842;color:#fff;padding:12px 17px;border-radius:10px;box-shadow:0 10px 30px #0002;z-index:50;font-size:12px;display:none}.toast.show{display:block}.imgpreview{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#edf1f5}.filelabel{display:inline-block}.filelabel input{display:none}
@media(max-width:1000px){.sidebar{width:215px}.content{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.recipe-list{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.shell{display:block}.sidebar{display:none;width:100%;position:relative}.sidebar.open{display:block}.topbar{height:auto;min-height:66px;padding:12px 15px}.topbar h2{font-size:17px}.mobilemenu{display:inline-flex}.content{padding:16px 12px}.pagehead{align-items:stretch;flex-direction:column}.pagehead .toolbar{justify-content:flex-start}.stats{gap:9px}.stat{padding:13px}.stat .value{font-size:21px}.topactions .hide-mobile{display:none}.formgrid{grid-template-columns:1fr}.formgroup.full{grid-column:auto}.recipe-list{grid-template-columns:1fr}.breakdown{grid-template-columns:1fr}.panelhead{align-items:flex-start;flex-direction:column}.search{max-width:none;min-width:0;width:100%}}
@media print{.sidebar,.topbar,.no-print,.btn,.actions,.toolbar{display:none!important}.content{padding:0;max-width:none}.panel,.stat{break-inside:avoid;border:1px solid #ddd}.shell{display:block}.main{width:100%}body{background:#fff}.stats{grid-template-columns:repeat(4,1fr)}}

/* Green CRPF theme adapted to the supplied CSS palette */
body{background:#071b14;color:#fff}.sidebar{background:linear-gradient(180deg,#063d2b,#021d14);border-right:1px solid #287b52}.brandmark{background:#00b94f;color:#022b1e}.brand small,.sidefoot,.crumb,.pagehead p,.stat .label,.stat .sub,.hint,.muted{color:#b7cfc2}.navlabel{color:#9bcbb1}.nav button{color:#d7eee0}.nav button:hover,.nav button.active{background:linear-gradient(90deg,#08a94d,#08773c);color:#fff;box-shadow:none}.topbar{background:#06402c;border-color:#287b52;color:#fff}.topbar h2{color:#ffe329}.content{color:#fff}.panel,.stat,.modal{background:linear-gradient(145deg,#0c3525,#061f17);border:1px solid #287b52;color:#fff;box-shadow:0 5px 15px #0006}.panelhead{border-color:#28533e}.stat:after{background:#00b94f12}.stat .sicon{background:#0a5037;color:#35e987}.btn{background:#245a43;color:#fff;border-color:#39845f}.btn.primary{background:#07964b;color:#fff;border-color:#07964b}.btn.dark{background:#022b1e;color:#fff;border-color:#287b52}.btn.danger{background:#b82d39;color:#fff;border-color:#b82d39}.field,select,textarea,input{background:#061e16;color:#fff;border-color:#39845f}.field::placeholder,input::placeholder,textarea::placeholder{color:#9bb8a7}th{background:#075334;color:#fff;border-color:#28533e}td{color:#fff;border-color:#28533e}tbody tr:hover{background:#ffffff08}.pill{background:#087b45;color:#fff}.pill.red{background:#a72c37;color:#fff}.pill.amber{background:#94720c;color:#fff}.pill.blue{background:#245a43;color:#fff}.breakdown>div{background:#082a20}.notice{background:#443914;color:#fff0a8;border-color:#927b21}.notice.blue{background:#0b3022;color:#d0e4ff;border-color:#287b52}.modalhead,.modalfoot{border-color:#287b52}.xbtn{background:#245a43;color:#fff}.recipe-card{border-color:#287b52;background:#082a20}.metricline{border-color:#28533e}.logo-mini{background:#0a5037;color:#35e987}.footer{color:#829e8e}.toast{background:#087b45;border:1px solid #69a987}.imgpreview{background:#0b3022}.formgroup label{color:#b9d4c5}.field:focus,select:focus,textarea:focus{border-color:#00b94f;box-shadow:0 0 0 3px #00b94f22}
@media print{body{background:#fff;color:#111}.panel,.stat{background:#fff;color:#111;box-shadow:none;border:1px solid #aaa}td,th{color:#111}th{background:#ddd}.topbar{display:none}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="brandmark">CR</div><div><h1 id="brandTitle">A COY (CRPF)</h1><small>MESS NCO: <span id="ncoLabel">Mess NCO</span><br>MANAGEMENT SYSTEM</small></div></div>
 <div class="navlabel">MAIN MENU</div>
 <nav class="nav" id="nav">
  <button class="active" data-page="dashboard"><span class="ico">▦</span> Dashboard</button>
  <button data-page="members"><span class="ico">♙</span> Members</button>
  <button data-page="stores"><span class="ico">▤</span> Ration Stores</button>
  <button data-page="recipes"><span class="ico">♨</span> Recipes & Ingredients</button>
  <button data-page="menu"><span class="ico">☷</span> Meal Menu</button>
  <button data-page="staff"><span class="ico">♧</span> Mess Staff & Duty</button>
  <button data-page="accounts"><span class="ico">₹</span> Accounts</button>
  <button data-page="transactions"><span class="ico">↔</span> Transactions & Reports</button>
  <button data-page="handover"><span class="ico">⇄</span> Mess Handover</button>
  <div class="navlabel">SYSTEM</div>
  <button data-page="settings"><span class="ico">⚙</span> Settings</button>
  <button data-page="backup"><span class="ico">⬇</span> Backup & Restore</button>
 </nav>
 <div class="sidefoot">Local mess records<br>Keep regular backups for safety.</div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobilemenu" id="mobileMenu">☰</button><div><div class="crumb">MESS OPERATIONS / <span id="crumb">DASHBOARD</span></div><h2 id="topTitle">Dashboard</h2></div></div><div class="topactions"><span class="pill" id="todayLabel">● Today</span><span class="pill" id="currentRole">Admin / Staff</span><button class="btn" onclick="switchRole()">Switch Role</button><button class="btn hide-mobile" onclick="window.print()">▧ Print / PDF</button><button class="btn primary" onclick="openModal('transaction')">＋ Add Transaction</button></div></header>
<div class="content" id="content"></div>
<div class="footer">CRPF Smart Mess Management · Device-only storage · Regular backup recommended</div>
</main>
</div>
<div class="modalback" id="modalback" role="dialog" aria-modal="true"><div class="modal"><div class="modalhead"><h3 id="modalTitle">Add record</h3><button class="xbtn" onclick="closeModal()">✕</button></div><form id="modalForm"><div class="modalbody" id="modalBody"></div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">Save Record</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n)||0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const defaults={settings:{messName:'A Coy (CRPF)',ncoName:'Mess NCO',monthlyLimit:0,unitName:'Mess',currency:'INR',contact:'',adminPin:'',viewerPin:''},members:[],items:[],purchases:[],recipes:[],menus:[],staff:[],transactions:[],handovers:[]};
let db=loadDB(),page='dashboard',editing=null,modalType='',modalExtra={},accessRole=(loadDB().settings.adminPin||loadDB().settings.viewerPin)?'viewer':'admin';
function loadDB(){try{let d=JSON.parse(localStorage.getItem('crpf_smart_mess_v1'));return d?{...structuredClone(defaults),...d,settings:{...defaults.settings,...d.settings}}:structuredClone(defaults)}catch(e){return structuredClone(defaults)}}
function saveDB(){localStorage.setItem('crpf_smart_mess_v1',JSON.stringify(db));refreshBrand()}
function refreshBrand(){let n=db.settings.messName||'CRPF Smart Mess';$('#brandTitle').textContent=n.toUpperCase();document.title=n+' — Management';let nco=$('#ncoLabel');if(nco)nco.textContent=db.settings.ncoName||'Mess NCO';let role=$('#currentRole');if(role)role.textContent=accessRole==='admin'?'NCO / Authorized Staff':'Member View Only'}
function canEdit(){return accessRole==='admin'}
function guardEdit(){if(canEdit())return true;toast('View-only access. Ask the Mess NCO / authorized staff to make changes.');return false}
function switchRole(){let choice=prompt('Enter A for NCO / authorized staff, or V for member view-only:','V');if(!choice)return;choice=choice.trim().toLowerCase();let pin=prompt('Enter the PIN for this role (leave blank only if no PIN is configured):','');if(pin===null)return;if(choice==='a'||choice==='admin'){if(db.settings.adminPin&&pin!==db.settings.adminPin){alert('Incorrect NCO / staff PIN');return}if(!db.settings.adminPin&&pin){alert('No admin PIN is set. Leave blank and set one in Settings.');return}accessRole='admin'}else if(choice==='v'||choice==='viewer'){if(db.settings.viewerPin&&pin!==db.settings.viewerPin){alert('Incorrect member view PIN');return}if(!db.settings.viewerPin&&pin){alert('No viewer PIN is set. Leave blank or configure one in Settings.');return}accessRole='viewer'}else{alert('Choose A or V');return}render();toast(accessRole==='admin'?'NCO / authorized staff mode':'Member view-only mode')}

function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sum(arr,fn){return arr.reduce((a,x)=>a+(Number(fn(x))||0),0)}
function totalPaid(){return sum(db.transactions.filter(t=>t.type==='Member Payment'||t.type==='Income'||t.type==='Advance Received'),t=>t.amount)}
function totalExpenses(){return sum(db.transactions.filter(t=>t.type==='Expense'||t.type==='Bill Paid'||t.type==='Ration Purchase'),t=>t.amount)}
function totalAdvance(){return sum(db.members,m=>m.advance)}
function totalPurchaseCost(){return sum(db.purchases,p=>p.qty*p.price)}
function balance(){return totalPaid()-totalExpenses()}
function navTo(p){page=p;$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#crumb').textContent=p.toUpperCase();$('#topTitle').textContent=({dashboard:'Dashboard',members:'Members',stores:'Ration Stores',recipes:'Recipes & Ingredients',menu:'Meal Menu',staff:'Mess Staff & Duty',accounts:'Accounts',transactions:'Transactions & Reports',handover:'Mess Handover',settings:'Settings',backup:'Backup & Restore'})[p]||p;$('#sidebar').classList.remove('open');render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)navTo(b.dataset.page)});$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');
$('#todayLabel').textContent='● '+new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
function pageHead(title,desc,action=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${desc}</p></div><div class="toolbar">${action}</div></div>`}
function btn(label,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}
function stat(label,value,sub,icon='●'){return `<div class="stat"><span class="sicon">${icon}</span><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub||''}</div></div>`}
function panel(title,body,extra=''){return `<section class="panel"><div class="panelhead"><h3>${title}</h3>${extra}</div>${body}</section>`}
function table(headers,rows,empty='No records yet. Use Add to create your first record.'){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}
function actionBtns(type,id){return `<div class="actions"><button class="btn small" onclick="viewRecord('${type}','${id}')">View</button>${canEdit()?`<button class="btn small" onclick="openModal('${type}','${id}')">Edit</button><button class="btn small danger" onclick="deleteRecord('${type}','${id}')">Delete</button>`:''}</div>`}
function render(){refreshBrand();const c=$('#content');if(page==='dashboard')c.innerHTML=dashboard();if(page==='members')c.innerHTML=membersPage();if(page==='stores')c.innerHTML=storesPage();if(page==='recipes')c.innerHTML=recipesPage();if(page==='menu')c.innerHTML=menuPage();if(page==='staff')c.innerHTML=staffPage();if(page==='accounts')c.innerHTML=accountsPage();if(page==='transactions')c.innerHTML=transactionsPage();if(page==='handover')c.innerHTML=handoverPage();if(page==='settings')c.innerHTML=settingsPage();if(page==='backup')c.innerHTML=backupPage()}
function dashboard(){let active=db.members.filter(m=>m.status==='Active').length, unpaid=db.members.filter(m=>(Number(m.due)||0)>0);let recent=[...db.transactions].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,6);return pageHead('Good day, Mess Team 👋','Mess overview, ration position aur monthly accounts ek jagah.',btn('＋ Add Member',"openModal('member')",'primary')+btn('＋ Purchase Ration',"openModal('purchase')")+btn('Print / PDF','window.print()'))+`<div class="stats">${stat('Active Members',active,`${db.members.length} total registered`,'♙')}${stat('Ration Stock Items',db.items.length,`${db.items.filter(i=>Number(i.qty)<=Number(i.min||0)).length} at/below minimum`,'▤')}${stat('Cash Balance',money(balance()),'Income minus recorded expenses','₹')}${stat('Member Advances',money(totalAdvance()),'Current advance total from member records','◉')}</div>`+`<div class="grid2">${panel('Recent Transactions',table(['Date','Description','Type','Amount'],recent.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.description||t.member||'—')}</td><td>${esc(t.type)}</td><td><b>${money(t.amount)}</b></td></tr>`).join(''),'No transactions recorded yet.'))}${panel('Quick Overview',`<div class="panelbody"><div class="metricline"><span>Ration purchase value</span><b>${money(totalPurchaseCost())}</b></div><div class="metricline"><span>Member dues</span><b>${money(sum(db.members,m=>m.due))}</b></div><div class="metricline"><span>Recipes saved</span><b>${db.recipes.length}</b></div><div class="metricline"><span>Menus scheduled</span><b>${db.menus.length}</b></div><div class="metricline"><span>Mess staff records</span><b>${db.staff.length}</b></div><div class="metricline"><span>Monthly ration limit</span><b>${money(db.settings.monthlyLimit)}</b></div><div class="notice blue" style="margin-top:14px">Use Backup & Restore regularly. Browser data may be lost if site data is cleared or you change devices.</div></div>`)}</div>`}
function membersPage(){let q=($('#memberSearch')?.value||'').toLowerCase();let list=db.members.filter(m=>[m.forceNo,m.name,m.rank,m.contact,m.status].join(' ').toLowerCase().includes(q));return pageHead('Members','Force number, personal details, mess advance, dues and membership status.',btn('＋ Add Member',"openModal('member')",'primary')+btn('Export CSV',"exportCSV('members')"))+`<div class="panel"><div class="panelhead"><h3>Member Register · ${list.length}</h3><input class="field search" id="memberSearch" placeholder="Search force no, name, rank, phone..." value="${esc(q)}" oninput="renderKeepSearch('members')"></div>${table(['Member','Force No.','Rank','Joining Date','Contact','Advance','Due','Status','Actions'],list.map(m=>`<tr><td><b>${esc(m.name)}</b><div class="muted">${esc(m.email||'')}</div></td><td>${esc(m.forceNo)}</td><td>${esc(m.rank)}</td><td>${esc(m.joinDate)}</td><td>${esc(m.contact)}</td><td>${money(m.advance)}</td><td>${money(m.due)}</td><td><span class="pill ${m.status==='Active'?'':'red'}">${esc(m.status)}</span></td><td>${actionBtns('member',m.id)}</td></tr>`).join(''))}</div>`}
function renderKeepSearch(p){let v=$('#memberSearch')?.value||'';render();if(p==='members'){let x=$('#memberSearch');if(x){x.focus();x.value=v;x.setSelectionRange(v.length,v.length)}}}
function storesPage(){let low=db.items.filter(i=>Number(i.qty)<=Number(i.min||0));return pageHead('Ration Stores','Stock balance, units, purchase history and low-stock visibility.',btn('＋ Add Ration Item',"openModal('item')",'primary')+btn('＋ Record Purchase',"openModal('purchase')")+btn('Export CSV',"exportCSV('items')"))+`<div class="stats">${stat('Items in Store',db.items.length,'Unique ration items','▤')}${stat('Stock Value',money(sum(db.items,i=>i.qty*i.price)),'Approx. current value','₹')}${stat('Low Stock',low.length,'At or below minimum level','!')}${stat('Purchase Value',money(totalPurchaseCost()),'Total recorded purchase cost','↗')}</div><div class="panel"><div class="panelhead"><h3>Current Stock</h3><input id="stockSearch" class="field search" placeholder="Search ration item..." oninput="filterTable('stockSearch','stockRows')"></div>${table(['Item','Available Qty','Unit','Purchase Unit','Unit Price','Minimum Level','Stock Value','Actions'],db.items.map(i=>`<tr class="stockRows"><td><b>${esc(i.name)}</b></td><td>${Number(i.qty)||0} ${esc(i.unit)}</td><td>${esc(i.unit)}</td><td>${esc(i.purchaseUnit||i.unit)}</td><td>${money(i.price)}</td><td>${Number(i.min)||0}</td><td>${money((Number(i.qty)||0)*(Number(i.price)||0))}</td><td>${actionBtns('item',i.id)}</td></tr>`).join(''))}</div>`+panel('Recent Purchases',table(['Date','Item','Qty','Unit Price','Total','Supplier / Bill','Actions'],[...db.purchases].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,12).map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(itemName(p.itemId))}</td><td>${p.qty} ${esc(p.unit)}</td><td>${money(p.price)}</td><td><b>${money(p.qty*p.price)}</b></td><td>${esc(p.supplier||'—')} ${esc(p.billNo||'')}</td><td>${actionBtns('purchase',p.id)}</td></tr>`).join('')))}
function itemName(id){return db.items.find(i=>i.id===id)?.name||'Deleted item'}
function recipesPage(){return pageHead('Recipes & Ingredients','Recipe ingredients linked to ration stock; estimated recipe cost updates from ingredient quantities.',btn('＋ Add Recipe',"openModal('recipe')",'primary'))+`<div class="recipe-list">${db.recipes.map(r=>`<div class="recipe-card"><div style="display:flex;justify-content:space-between;gap:8px"><h4>${esc(r.name)}</h4><span class="pill blue">${esc(r.meal||'Any meal')}</span></div><p>${esc(r.description||'No preparation notes')}</p><div class="metricline"><span>Ingredients</span><b>${(r.ingredients||[]).length}</b></div><div class="metricline"><span>Servings</span><b>${Number(r.servings)||1}</b></div><div class="metricline"><span>Estimated cost</span><b>${money(recipeCost(r))}</b></div><div class="actions" style="margin-top:12px">${actionBtns('recipe',r.id)}</div></div>`).join('')||`<div class="panel"><div class="empty">No recipes saved. Click “Add Recipe” to start.</div></div>`}</div>`}
function recipeCost(r){return sum(r.ingredients||[],x=>Number(x.qty)*Number(db.items.find(i=>i.id===x.itemId)?.price||0))}
function menuPage(){return pageHead('Meal Menu','Date-wise meal schedule linked with recipes.',btn('＋ Schedule Meal',"openModal('menu')",'primary')+btn('Print Menu','window.print()'))+`<div class="panel"><div class="panelhead"><h3>Scheduled Menu</h3><input id="menuDate" class="field filter" type="date" value="${today()}" onchange="filterMenuDate()"></div>${table(['Date','Meal','Recipe','Servings','Notes','Actions'],[...db.menus].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(m=>`<tr class="menuRow" data-date="${esc(m.date)}"><td>${esc(m.date)}</td><td><span class="pill blue">${esc(m.meal)}</span></td><td><b>${esc(db.recipes.find(r=>r.id===m.recipeId)?.name||m.recipeName||'—')}</b></td><td>${Number(m.servings)||1}</td><td>${esc(m.notes||'—')}</td><td>${actionBtns('menu',m.id)}</td></tr>`).join(''))}</div>`}
function filterMenuDate(){let v=$('#menuDate').value;$$('.menuRow').forEach(r=>r.style.display=(!v||r.dataset.date===v)?'':'none')}
function staffPage(){return pageHead('Mess Staff & Duty','Record duty roster, role, shift, activity and duty dates for all assigned members.',btn('＋ Add Duty Record',"openModal('staff')",'primary')+btn('Print Duty Roster','window.print()'))+`<div class="panel"><div class="panelhead"><h3>Staff Duty Register</h3><span class="pill">${db.staff.length} records</span></div>${table(['Date','Member','Force No.','Duty / Role','Shift','Activity / Notes','Actions'],[...db.staff].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(s=>`<tr><td>${esc(s.date)}</td><td><b>${esc(db.members.find(m=>m.id===s.memberId)?.name||s.memberName||'—')}</b></td><td>${esc(db.members.find(m=>m.id===s.memberId)?.forceNo||'—')}</td><td><span class="pill blue">${esc(s.role)}</span></td><td>${esc(s.shift||'—')}</td><td>${esc(s.notes||'—')}</td><td>${actionBtns('staff',s.id)}</td></tr>`).join(''))}</div>`}
function accountsPage(){let income=totalPaid(),expenses=totalExpenses();let byType={};db.transactions.forEach(t=>byType[t.type]=(byType[t.type]||0)+(Number(t.amount)||0));return pageHead('Accounts & Monthly Summary','Recorded income, expenses, bills, member dues and available cash balance.',btn('＋ Add Transaction',"openModal('transaction')",'primary')+btn('Print / PDF','window.print()'))+`<div class="stats">${stat('Total Income',money(income),'Payments, income and advances','↗')}${stat('Total Expenses',money(expenses),'Expenses, bills and ration purchases','↘')}${stat('Cash Balance',money(income-expenses),'Income less recorded expenses','₹')}${stat('Outstanding Member Dues',money(sum(db.members,m=>m.due)),'From member register','!')}</div>`+`<div class="grid2">${panel('Account Breakdown',`<div class="panelbody">${Object.entries(byType).map(([k,v])=>`<div class="metricline"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('')||'<div class="empty">No transactions yet.</div>'}</div>`)}${panel('Monthly Ration Limit',`<div class="panelbody"><div class="metricline"><span>Monthly limit</span><b>${money(db.settings.monthlyLimit)}</b></div><div class="metricline"><span>Recorded ration purchases</span><b>${money(sum(db.purchases,p=>p.qty*p.price))}</b></div><div class="metricline"><span>Limit remaining (based on all saved purchases)</span><b>${money(Number(db.settings.monthlyLimit)-sum(db.purchases,p=>p.qty*p.price))}</b></div><p class="hint">For an accurate month-only figure, filter purchase records by date in the transactions report or export the data. This limit is a tracking indicator, not an accounting certification.</p></div>`)}</div>`+panel('Member Balance Register',table(['Member','Force No.','Advance','Due','Status','Actions'],db.members.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.forceNo)}</td><td>${money(m.advance)}</td><td>${money(m.due)}</td><td>${esc(m.status)}</td><td>${actionBtns('member',m.id)}</td></tr>`).join('')))}
function transactionsPage(){let rows=[...db.transactions].sort((a,b)=>(b.date||'').localeCompare(a.date||''));return pageHead('Transactions & Reports','Central ledger for member payments, expenses, bills, and ration-related transactions.',btn('＋ Add Transaction',"openModal('transaction')",'primary')+btn('Export CSV',"exportCSV('transactions')")+btn('WhatsApp Summary','shareWhatsApp()')+btn('Print / PDF','window.print()'))+`<div class="panel"><div class="panelhead"><h3>Transaction Ledger</h3><div class="toolbar"><input id="txnFrom" class="field filter" type="date" onchange="filterTxn()"><input id="txnTo" class="field filter" type="date" onchange="filterTxn()"><input id="txnSearch" class="field search" placeholder="Search description, member, type..." oninput="filterTxn()"></div></div>${table(['Date','Type','Description / Member','Payment Mode','Reference','Amount','Actions'],rows.map(t=>`<tr class="txnRow" data-date="${esc(t.date)}" data-search="${esc([t.type,t.description,t.member,t.reference].join(' ').toLowerCase())}"><td>${esc(t.date)}</td><td><span class="pill ${['Expense','Bill Paid','Ration Purchase'].includes(t.type)?'red':'blue'}">${esc(t.type)}</span></td><td><b>${esc(t.description||t.member||'—')}</b><div class="muted">${esc(t.member||'')}</div></td><td>${esc(t.mode||'—')}</td><td>${esc(t.reference||'—')}</td><td><b>${money(t.amount)}</b></td><td>${actionBtns('transaction',t.id)}</td></tr>`).join(''))}</div>`}
function filterTxn(){let a=$('#txnFrom').value,b=$('#txnTo').value,q=($('#txnSearch').value||'').toLowerCase();$$('.txnRow').forEach(r=>r.style.display=((!a||r.dataset.date>=a)&&(!b||r.dataset.date<=b)&&r.dataset.search.includes(q))?'':'none')}
function handoverPage(){let h=[...db.handovers].sort((a,b)=>(b.date||'').localeCompare(a.date||''));return pageHead('Mess Handover','Outgoing / incoming NCO handover with cash, ration stock, dues and notes snapshot.',btn('＋ New Handover',"openModal('handover')",'primary')+btn('Print / PDF','window.print()'))+`<div class="notice blue" style="margin-bottom:18px">Current live position: Cash balance <b>${money(balance())}</b> · Member advance total <b>${money(totalAdvance())}</b> · Member dues <b>${money(sum(db.members,m=>m.due))}</b> · Ration stock value <b>${money(sum(db.items,i=>i.qty*i.price))}</b></div>`+panel('Handover Register',table(['Date','Outgoing NCO','Incoming NCO','Cash Balance','Ration Value','Dues','Notes','Actions'],h.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.outgoing)}</td><td>${esc(x.incoming)}</td><td>${money(x.cash)}</td><td>${money(x.stockValue)}</td><td>${money(x.dues)}</td><td>${esc(x.notes||'—')}</td><td>${actionBtns('handover',x.id)}</td></tr>`).join('')))}
function settingsPage(){return pageHead('Settings','Configure mess name, NCO name, ration budget and staff access.')+`<div class="grid2">${panel('Mess Configuration',`<div class="panelbody"><form id="settingsForm"><div class="formgrid"><div class="formgroup full"><label>Mess / Unit Name</label><input class="field" name="messName" value="${esc(db.settings.messName)}" required></div><div class="formgroup full"><label>Mess NCO Name (shown automatically)</label><input class="field" name="ncoName" value="${esc(db.settings.ncoName||'Mess NCO')}" required></div><div class="formgroup"><label>Monthly Ration Money Limit (₹)</label><input class="field" name="monthlyLimit" type="number" min="0" step=".01" value="${Number(db.settings.monthlyLimit)||0}"></div><div class="formgroup"><label>Unit / Mess Identifier</label><input class="field" name="unitName" value="${esc(db.settings.unitName)}"></div><div class="formgroup full"><label>Contact / Notes</label><input class="field" name="contact" value="${esc(db.settings.contact)}" placeholder="Optional phone or office details"></div><div class="formgroup"><label>NCO / Authorized Staff PIN</label><input class="field" name="adminPin" type="password" minlength="4" value="" placeholder="${db.settings.adminPin?'Configured — enter new PIN to change':''}"></div><div class="formgroup"><label>Member View-only PIN (optional)</label><input class="field" name="viewerPin" type="password" minlength="4" value="" placeholder="${db.settings.viewerPin?'Configured — enter new PIN to change':''}"></div></div><p class="hint">Leave PIN fields blank to keep existing PINs. These PINs control ordinary app use on this device; they are not server-grade security.</p><div style="margin-top:16px"><button class="btn primary" ${canEdit()?'':'disabled title="Switch to NCO / staff mode first"'}>Save Settings</button></div></form></div>`)}${panel('System Information',`<div class="panelbody"><div class="metricline"><span>Current role</span><b>${canEdit()?'NCO / Authorized Staff':'Member View Only'}</b></div><div class="metricline"><span>Storage</span><b>Browser local storage</b></div><div class="metricline"><span>Members</span><b>${db.members.length}</b></div><div class="metricline"><span>Ration items</span><b>${db.items.length}</b></div><div class="metricline"><span>Transactions</span><b>${db.transactions.length}</b></div><div class="notice" style="margin-top:14px">Each phone/computer stores its own data. Use JSON backup/restore to transfer records; GitHub Pages alone does not synchronize devices. For genuine security and shared sync, a server/database is required.</div></div>`)}</div>`}
function backupPage(){return pageHead('Backup & Restore','Download a complete JSON backup, restore a previous backup, or export registers as CSV.')+`<div class="grid2">${panel('Full Backup',`<div class="panelbody"><div class="logo-mini">⬇</div><h3>Export all mess data</h3><p class="hint">Includes members, stock, purchases, recipes, menus, staff duty, accounts, settings and handover records.</p><button class="btn primary" onclick="downloadBackup()">Download JSON Backup</button><button class="btn" onclick="exportCSV('members')">Members CSV</button><button class="btn" onclick="exportCSV('items')">Stock CSV</button><button class="btn" onclick="exportCSV('transactions')">Transactions CSV</button></div>`)}${panel('Restore Backup',`<div class="panelbody"><p class="hint">Restoring replaces the current browser data. Download a backup first. Only restore a trusted JSON file exported by this app.</p><label class="filelabel"><span class="btn dark">Choose JSON Backup</span><input type="file" accept=".json,application/json" onchange="restoreBackup(event)"></label><div style="height:12px"></div><button class="btn danger" onclick="clearAllData()">Clear All Local Data</button></div>`)}</div>`}
$('#content').addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();if(!guardEdit())return;let f=new FormData(e.target);db.settings={...db.settings,messName:f.get('messName'),ncoName:f.get('ncoName'),monthlyLimit:Number(f.get('monthlyLimit'))||0,unitName:f.get('unitName'),contact:f.get('contact')};let ap=String(f.get('adminPin')||'').trim(),vp=String(f.get('viewerPin')||'').trim();if(ap){if(ap.length<4){toast('NCO / staff PIN must be at least 4 characters');return}db.settings.adminPin=ap}if(vp){if(vp.length<4){toast('View PIN must be at least 4 characters');return}db.settings.viewerPin=vp}saveDB();toast('Settings saved');render()}});
function filterTable(inputId,cls){let q=$('#'+inputId).value.toLowerCase();$$('.'+cls).forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
const schemas={
 member:{title:'Member',fields:[['forceNo','Force Number','text',true],['name','Full Name','text',true],['rank','Rank','text',true],['image','Photo URL (optional)','text',false],['joinDate','Joining Date','date',true],['contact','Contact Number','tel',false],['email','Email / Address','text',false],['advance','Mess Advance (₹)','number',false],['due','Outstanding Due (₹)','number',false],['status','Status','select',true,['Active','Inactive','Transferred','Retired']],['notes','Other Details / Notes','textarea',false]]},
 item:{title:'Ration Item',fields:[['name','Item Name','text',true],['qty','Current Quantity','number',true],['unit','Stock Unit','select',true,['kg','g','ltr','ml','piece','pkt','dozen','bag','tin']],['purchaseUnit','Purchase Unit','select',false,['kg','g','ltr','ml','piece','pkt','bag','tin','box']],['price','Unit Price (₹)','number',true],['min','Minimum Stock Alert','number',false],['notes','Notes','textarea',false]]},
 purchase:{title:'Ration Purchase',fields:[['date','Purchase Date','date',true],['itemId','Ration Item','select',true],['qty','Quantity Purchased','number',true],['unit','Unit','select',true,['kg','g','ltr','ml','piece','pkt','bag','tin','box']],['price','Price per Unit (₹)','number',true],['supplier','Supplier / Shop','text',false],['billNo','Bill / Invoice No.','text',false],['notes','Notes','textarea',false]]},
 recipe:{title:'Recipe',fields:[['name','Recipe Name','text',true],['meal','Meal Type','select',true,['Morning Tea','Breakfast','Lunch','Midday Tea','Dinner','Any meal']],['servings','Servings','number',true],['description','Preparation Notes','textarea',false]]},
 menu:{title:'Schedule Meal',fields:[['date','Menu Date','date',true],['meal','Meal','select',true,['Morning Tea','Breakfast','Lunch','Midday Tea','Dinner']],['recipeId','Recipe','select',true],['servings','Servings','number',true],['notes','Notes','textarea',false]]},
 staff:{title:'Mess Staff Duty',fields:[['date','Duty Date','date',true],['memberId','Mess Member','select',true],['role','Duty / Role','select',true,['Mess NCO','Mess SO','Cook','Assistant Cook','Accountant','Store Keeper','Helper','Cleaning','Other']],['shift','Shift','select',false,['Morning','Afternoon','Evening','Full Day','Night']],['notes','Activities / Duty Notes','textarea',false]]},
 transaction:{title:'Transaction',fields:[['date','Transaction Date','date',true],['type','Transaction Type','select',true,['Member Payment','Advance Received','Income','Expense','Bill Paid','Ration Purchase','Refund','Other']],['amount','Amount (₹)','number',true],['memberId','Related Member (optional)','select',false],['description','Description','text',true],['mode','Payment Mode','select',false,['Cash','UPI','Bank Transfer','Cheque','Other']],['reference','Receipt / Bill Reference','text',false],['notes','Notes','textarea',false]]},
 handover:{title:'Mess Handover',fields:[['date','Handover Date','date',true],['outgoing','Outgoing NCO / In-charge','text',true],['incoming','Incoming NCO / In-charge','text',true],['cash','Cash Balance at Handover (₹)','number',true],['stockValue','Ration Stock Value (₹)','number',true],['dues','Outstanding Dues (₹)','number',true],['advance','Member Advance Total (₹)','number',false],['notes','Pending Work / Remarks','textarea',false]]}
};
function optionsFor(key){if(key==='itemId')return db.items.map(i=>[i.id,i.name]);if(key==='recipeId')return db.recipes.map(r=>[r.id,r.name]);if(key==='memberId')return db.members.map(m=>[m.id,m.name+' — '+m.forceNo]);return []}
function getRecord(type,id){let map={member:'members',item:'items',purchase:'purchases',recipe:'recipes',menu:'menus',staff:'staff',transaction:'transactions',handover:'handovers'};return db[map[type]]?.find(x=>x.id===id)}
function openModal(type,id=null){if(!guardEdit())return;modalType=type;editing=id;modalExtra={};$('#modalForm').onsubmit=null;$('#modalForm').querySelector('button[type=submit]').textContent='Save Record';$('#modalForm').querySelector('button[type=submit]').classList.remove('hidden');let schema=schemas[type];if(!schema){toast('Unsupported form');return}let rec=id?getRecord(type,id):{};$('#modalTitle').textContent=(id?'Edit ':'Add ')+schema.title;let html='';
if(type==='recipe'){html+=`<div class="formgroup full" style="margin-bottom:15px"><label>Ingredients</label><div id="ingredientsEditor">${ingredientRows(rec.ingredients||[])}</div><button type="button" class="btn small" style="margin-top:8px" onclick="addIngredientRow()">＋ Add Ingredient</button><p class="hint">Quantity uses the stock unit. Estimated cost is calculated from the ration item's saved unit price.</p></div>`}
html+='<div class="formgrid">';
schema.fields.forEach(([key,label,kind,required,choices])=>{let val=rec[key]??(key==='date'?today():key==='servings'?1:key==='status'?'Active':key==='qty'||key==='price'||key==='amount'||key==='advance'||key==='due'||key==='min'||key==='cash'||key==='stockValue'||key==='dues'?0:'');let opts=choices||optionsFor(key);html+=`<div class="formgroup ${kind==='textarea'?'full':''}"><label>${label}${required?' *':''}</label>`;
if(kind==='select'){html+=`<select class="field" name="${key}" ${required?'required':''}><option value="">Select...</option>${opts.map(o=>{let v=Array.isArray(o)?o[0]:o,txt=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(txt)}</option>`}).join('')}</select>`}
else if(kind==='textarea')html+=`<textarea class="field" name="${key}" rows="3">${esc(val)}</textarea>`;
else html+=`<input class="field" name="${key}" type="${kind}" value="${esc(val)}" ${required?'required':''} ${kind==='number'?'step="any" min="0"':''}>`;
html+='</div>'});
html+='</div>';
if(type==='purchase')html+=`<p class="hint" style="margin-top:12px">Saving a purchase updates the item's current stock and records the purchase total in the ledger. Keep the unit consistent with the stock item.</p>`;
if(type==='transaction')html+=`<p class="hint" style="margin-top:12px">Member payment, income and advance received count as inflow; expense, bill paid and ration purchase count as outflow in the cash balance.</p>`;
$('#modalBody').innerHTML=html;$('#modalback').classList.add('show');}
function ingredientRows(arr){return arr.map(x=>ingredientRow(x)).join('')||ingredientRow({itemId:'',qty:1})}
function ingredientRow(x){return `<div class="ingredient-row" style="display:grid;grid-template-columns:1fr 100px 35px;gap:8px;margin-bottom:8px"><select class="field ing-item"><option value="">Select ration item</option>${db.items.map(i=>`<option value="${i.id}" ${i.id===x.itemId?'selected':''}>${esc(i.name)} (${esc(i.unit)})</option>`).join('')}</select><input class="field ing-qty" type="number" min="0" step="any" value="${Number(x.qty)||1}" placeholder="Qty"><button type="button" class="btn small danger" onclick="this.parentElement.remove()">×</button></div>`}
function addIngredientRow(){let d=document.createElement('div');d.innerHTML=ingredientRow({qty:1});$('#ingredientsEditor').append(d.firstElementChild)}
function closeModal(){$('#modalback').classList.remove('show');editing=null;modalType='';$('#modalForm').querySelector('button[type=submit]').onclick=null}
$('#modalForm').addEventListener('submit',e=>{e.preventDefault();if(!guardEdit())return;let type=modalType,s=schemas[type],f=new FormData(e.target),obj={};s.fields.forEach(([k])=>{let v=f.get(k);if(['qty','price','amount','advance','due','min','servings','cash','stockValue','dues'].includes(k))obj[k]=Number(v)||0;else obj[k]=v||''});let id=editing||uid();obj.id=id;
if(type==='recipe'){obj.ingredients=$$('#ingredientsEditor .ingredient-row').map(r=>({itemId:r.querySelector('.ing-item').value,qty:Number(r.querySelector('.ing-qty').value)||0})).filter(x=>x.itemId)}
if(type==='purchase'){let old=editing?getRecord(type,editing):null;let item=db.items.find(i=>i.id===obj.itemId);if(!item){toast('Please add/select a ration item first');return}if(old){let oldItem=db.items.find(i=>i.id===old.itemId);if(oldItem)oldItem.qty-=Number(old.qty)||0}item.qty=(Number(item.qty)||0)+obj.qty;item.price=obj.price;obj.unit=obj.unit||item.unit;upsert('purchases',obj);let txn=db.transactions.find(t=>t.purchaseId===id);if(txn){txn.date=obj.date;txn.amount=obj.qty*obj.price;txn.description='Ration purchase: '+item.name;txn.type='Ration Purchase'}else db.transactions.push({id:uid(),purchaseId:id,date:obj.date,type:'Ration Purchase',amount:obj.qty*obj.price,description:'Ration purchase: '+item.name,mode:'Cash',reference:obj.billNo||'',notes:obj.notes||''});saveDB();closeModal();render();toast('Purchase saved and stock updated');return}
if(type==='transaction'&&obj.memberId){let m=db.members.find(m=>m.id===obj.memberId);obj.member=m?.name||''}
if(type==='staff'&&obj.memberId){let m=db.members.find(m=>m.id===obj.memberId);obj.memberName=m?.name||''}
if(type==='menu'&&obj.recipeId){obj.recipeName=db.recipes.find(r=>r.id===obj.recipeId)?.name||''}
upsert(({member:'members',item:'items',recipe:'recipes',menu:'menus',staff:'staff',transaction:'transactions',handover:'handovers'})[type],obj);
saveDB();closeModal();render();toast(s.title+' saved successfully')});
function upsert(key,obj){let i=db[key].findIndex(x=>x.id===obj.id);if(i>=0)db[key][i]={...db[key][i],...obj};else db[key].push(obj)}
function deleteRecord(type,id){if(!guardEdit())return;let map={member:'members',item:'items',purchase:'purchases',recipe:'recipes',menu:'menus',staff:'staff',transaction:'transactions',handover:'handovers'};let key=map[type];if(!confirm('Delete this record? This cannot be undone unless you have a backup.'))return;let rec=getRecord(type,id);if(type==='purchase'&&rec){let it=db.items.find(i=>i.id===rec.itemId);if(it)it.qty-=Number(rec.qty)||0;db.transactions=db.transactions.filter(t=>t.purchaseId!==id)}db[key]=db[key].filter(x=>x.id!==id);saveDB();render();toast('Record deleted')}
function viewRecord(type,id){let r=getRecord(type,id);if(!r)return;let fields=Object.entries(r).filter(([k])=>k!=='id'&&k!=='ingredients').map(([k,v])=>`<div class="metricline"><span>${esc(k.replace(/([A-Z])/g,' $1'))}</span><b>${esc(typeof v==='object'?JSON.stringify(v):v)}</b></div>`).join('');if(r.ingredients)fields+=`<div class="metricline"><span>Ingredients</span><b>${r.ingredients.map(x=>itemName(x.itemId)+' × '+x.qty).join(', ')}</b></div><div class="metricline"><span>Estimated cost</span><b>${money(recipeCost(r))}</b></div>`;$('#modalTitle').textContent='Record Details';$('#modalBody').innerHTML=fields||'<p>No details available.</p>';$('#modalForm').querySelector('button[type=submit]').textContent='Close';$('#modalForm').querySelector('button[type=submit]').onclick= e=>{e.preventDefault();closeModal()};$('#modalback').classList.add('show')}
function downloadBackup(){if(!guardEdit())return;let blob=new Blob([JSON.stringify({...db,backupCreatedAt:new Date().toISOString(),app:'CRPF Smart Mess Management'},null,2)],{type:'application/json'});downloadBlob(blob,'crpf-mess-backup-'+today()+'.json');toast('Backup downloaded')}
function restoreBackup(e){if(!guardEdit()){e.target.value='';return}let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!confirm('This will replace all current mess records. Continue?'))return;db={...structuredClone(defaults),...d,settings:{...defaults.settings,...d.settings}};saveDB();render();toast('Backup restored successfully')}catch(err){alert('Invalid backup file. Please select a JSON backup exported by this app.')}};r.readAsText(file);e.target.value=''}
function clearAllData(){if(!guardEdit())return;if(!confirm('WARNING: Permanently clear ALL local mess records? Download a backup first.'))return;if(!confirm('Confirm again: clear all records on this browser?'))return;db=structuredClone(defaults);saveDB();render();toast('Local records cleared')}
function downloadBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(key){let arr=db[key]||[];if(!arr.length){toast('No records to export');return}let cols=[...new Set(arr.flatMap(o=>Object.keys(o)))];let csv=[cols.join(','),...arr.map(o=>cols.map(k=>{let v=o[k];if(Array.isArray(v)||typeof v==='object'&&v!==null)v=JSON.stringify(v);return '"'+String(v??'').replace(/"/g,'""')+'"'}).join(','))].join('\r\n');downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),key+'-'+today()+'.csv')}
function shareWhatsApp(){let msg=`${db.settings.messName}\nMess summary (${today()})\nCash balance: ${money(balance())}\nMember advance: ${money(totalAdvance())}\nMember dues: ${money(sum(db.members,m=>m.due))}\nRation stock value: ${money(sum(db.items,i=>i.qty*i.price))}\nTransactions: ${db.transactions.length}\nPlease verify with the official ledger.`;window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank')}
render();
